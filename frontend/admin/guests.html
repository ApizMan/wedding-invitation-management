<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Senarai Tetamu — RSVP Admin</title>
  <script src="/shared-assets/auth-client.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Lato',sans-serif; background:#0f1e17; color:#fdf8f0; }
    .field-group { background:rgba(255,255,255,.03); border:1px solid rgba(201,168,76,.15); border-radius:6px; padding:24px; margin-bottom:20px; }
    .field-group h3 { font-family:'Playfair Display',serif; color:#e8d5a3; font-size:1rem; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid rgba(201,168,76,.15); }
    table { width:100%; min-width:560px; border-collapse:collapse; font-size:.85rem; }
    th { text-align:left; color:#c9a84c; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; padding:10px 12px; border-bottom:1px solid rgba(201,168,76,.2); }
    td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.05); color:#fdf8f0; }
    tr:hover td { background:rgba(255,255,255,.02); }
    .badge { font-size:.72rem; padding:3px 10px; border-radius:20px; white-space:nowrap; }
    .badge-hadir { background:rgba(76,175,80,.15); border:1px solid rgba(76,175,80,.4); color:#8fd99a; }
    .badge-tidak { background:rgba(196,68,68,.15); border:1px solid rgba(196,68,68,.4); color:#fca5a5; }
    .field-hint { color:rgba(201,168,76,.45); font-size:.72rem; margin-top:4px; }
    .filter-btn { background:rgba(255,255,255,.04); border:1px solid rgba(201,168,76,.25); color:#e8d5a3; font-size:.78rem; padding:7px 16px; border-radius:20px; cursor:pointer; transition:all .2s; }
    .filter-btn.active { background:rgba(201,168,76,.18); border-color:#c9a84c; color:#c9a84c; }
    .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
    @media(max-width:760px) { .stats-row { grid-template-columns:repeat(2,1fr); } }
    @media(max-width:420px) { .stats-row { grid-template-columns:1fr; } }
    .table-scroll { overflow-x:auto; }
    .top-header { flex-wrap:wrap; height:auto; min-height:60px; gap:10px; padding:10px 24px; }
    @media(max-width:640px) { .top-header { padding:10px 16px; } }
  </style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Top Nav -->
  <header class="top-header" style="background:rgba(0,0,0,.4);border-bottom:1px solid rgba(201,168,76,.2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);">
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="/admin/dashboard" style="display:flex;align-items:center;gap:6px;color:rgba(201,168,76,.6);text-decoration:none;font-size:.82rem;transition:color .2s;" onmouseover="this.style.color='#c9a84c'" onmouseout="this.style.color='rgba(201,168,76,.6)'">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Dashboard
      </a>
      <span style="color:rgba(201,168,76,.2);">/</span>
      <a id="editor-link" href="#" style="color:rgba(201,168,76,.6);text-decoration:none;font-size:.82rem;">Editor</a>
      <span style="color:rgba(201,168,76,.2);">/</span>
      <span style="font-family:'Playfair Display',serif;color:#e8d5a3;font-size:1rem;">Senarai Tetamu</span>
    </div>
    <a href="#" onclick="KJAuth.logout('/admin/login'); return false;" style="color:rgba(232,213,163,.4);font-size:.78rem;text-decoration:none;padding:7px 12px;border-radius:3px;border:1px solid rgba(201,168,76,.15);">Log Keluar</a>
  </header>

  <!-- Body -->
  <div style="flex:1;padding:28px 24px;max-width:980px;margin:0 auto;width:100%;">

    <!-- Stats row -->
    <div class="stats-row">
      <div style="background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:18px 20px;">
        <p style="color:rgba(201,168,76,.6);font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px;">Jumlah Respons</p>
        <p id="stat-total" style="font-family:'Playfair Display',serif;font-size:1.7rem;color:#c9a84c;">—</p>
      </div>
      <div style="background:rgba(76,175,80,.07);border:1px solid rgba(76,175,80,.25);border-radius:6px;padding:18px 20px;">
        <p style="color:rgba(143,217,154,.7);font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px;">Datang</p>
        <p id="stat-hadir" style="font-family:'Playfair Display',serif;font-size:1.7rem;color:#8fd99a;">—</p>
      </div>
      <div style="background:rgba(196,68,68,.07);border:1px solid rgba(196,68,68,.25);border-radius:6px;padding:18px 20px;">
        <p style="color:rgba(252,165,165,.7);font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px;">Tidak Datang</p>
        <p id="stat-tidak" style="font-family:'Playfair Display',serif;font-size:1.7rem;color:#fca5a5;">—</p>
      </div>
      <div style="background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:18px 20px;">
        <p style="color:rgba(201,168,76,.6);font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px;">Jumlah Kehadiran (Pax)</p>
        <p id="stat-pax" style="font-family:'Playfair Display',serif;font-size:1.7rem;color:#c9a84c;">—</p>
      </div>
    </div>

    <!-- Attendance table -->
    <div class="field-group">
      <h3>Senarai Kehadiran</h3>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Nama</th><th>Telefon</th><th>Status</th><th>Bilangan</th><th>Tarikh Hantar</th></tr>
          </thead>
          <tbody id="attendance-tbody"></tbody>
        </table>
      </div>
      <p class="field-hint" id="attendance-empty" style="display:none;margin-top:12px;">Belum ada respons kehadiran.</p>
    </div>

    <!-- Wishes table -->
    <div class="field-group">
      <h3>Senarai Ucapan</h3>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Nama</th><th>Ucapan</th><th>Tarikh Hantar</th></tr>
          </thead>
          <tbody id="wishes-tbody"></tbody>
        </table>
      </div>
      <p class="field-hint" id="wishes-empty" style="display:none;margin-top:12px;">Belum ada ucapan.</p>
    </div>

  </div>

  <script>
    if (!KJAuth.getStoredToken()) { location.href = '/admin/login'; }

    const templateId = location.pathname.split('/')[3]; // /admin/template/{id}/guests
    document.getElementById('editor-link').href = `/admin/template/${templateId}/edit`;

    function escHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '—';
      return d.toLocaleString('ms-MY', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    async function loadGuests() {
      try {
        const res = await KJAuth.authFetch(`/api/template/${templateId}/rsvps`);
        const entries = await res.json();
        const attendance = entries.filter(e => e.type === 'attendance');
        const wishes = entries.filter(e => e.type === 'wish');

        const hadirList = attendance.filter(e => e.attendance === 'hadir');
        const tidakList = attendance.filter(e => e.attendance === 'tidak_hadir');
        const totalPax = hadirList.reduce((sum, e) => sum + (Number(e.pax) || 1), 0);

        document.getElementById('stat-total').textContent = attendance.length;
        document.getElementById('stat-hadir').textContent = hadirList.length;
        document.getElementById('stat-tidak').textContent = tidakList.length;
        document.getElementById('stat-pax').textContent = totalPax;

        const attBody = document.getElementById('attendance-tbody');
        attBody.innerHTML = attendance.map(e => `
          <tr>
            <td>${escHtml(e.name)}</td>
            <td>${escHtml(e.phone || '—')}</td>
            <td><span class="badge ${e.attendance === 'hadir' ? 'badge-hadir' : 'badge-tidak'}">${e.attendance === 'hadir' ? 'Datang' : 'Tidak Datang'}</span></td>
            <td>${e.attendance === 'hadir' ? escHtml(e.pax || 1) : '—'}</td>
            <td>${formatDate(e.submittedAt)}</td>
          </tr>`).join('');
        document.getElementById('attendance-empty').style.display = attendance.length ? 'none' : 'block';

        const wishBody = document.getElementById('wishes-tbody');
        wishBody.innerHTML = wishes.map(e => `
          <tr>
            <td>${escHtml(e.name)}</td>
            <td style="max-width:420px;">${escHtml(e.message)}</td>
            <td>${formatDate(e.submittedAt)}</td>
          </tr>`).join('');
        document.getElementById('wishes-empty').style.display = wishes.length ? 'none' : 'block';
      } catch (err) {
        document.getElementById('attendance-empty').textContent = 'Ralat memuatkan data.';
        document.getElementById('attendance-empty').style.display = 'block';
      }
    }
    loadGuests();
    setInterval(loadGuests, 8000);
  </script>
</body>
</html>
