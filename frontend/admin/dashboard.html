<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — RSVP Admin</title>
  <script src="/shared-assets/auth-client.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Lato',sans-serif; background:#0f1e17; color:#fdf8f0; }
    .card { background:rgba(255,255,255,.04); border:1px solid rgba(201,168,76,.25); border-radius:6px; transition:border-color .3s,transform .3s,box-shadow .3s; }
    .card:hover { border-color:rgba(201,168,76,.7); transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,.4); }
    .badge { background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.08)); border:1px solid rgba(201,168,76,.3); }
    .btn-edit { background:linear-gradient(135deg,#c9a84c,#8b6914); }
    .btn-edit:hover { opacity:.9; }
    .btn-preview { border:1px solid rgba(201,168,76,.5); color:#c9a84c; }
    .btn-preview:hover { background:rgba(201,168,76,.1); }
    .sidebar { background:rgba(0,0,0,.3); border-right:1px solid rgba(201,168,76,.15); }
    .nav-item { transition:background .2s; border-radius:4px; }
    .nav-item:hover,.nav-item.active { background:rgba(201,168,76,.1); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation:fadeIn .5s ease forwards; }
    .skeleton { background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%); background-size:200% auto; animation:skeleton 1.5s linear infinite; }
    @keyframes skeleton { 0%{background-position:200% center} 100%{background-position:-200% center} }
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:36px; }
    @media(max-width:640px) { .stats-row { grid-template-columns:1fr; } }
    .top-header { flex-wrap:wrap; height:auto; min-height:60px; gap:10px; padding:10px 24px; }
    @media(max-width:480px) { .top-header { padding:10px 16px; } }
  </style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Top Nav -->
  <header class="top-header" style="background:rgba(0,0,0,.4);border-bottom:1px solid rgba(201,168,76,.2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);">
    <div style="display:flex;align-items:center;gap:12px;">
      <svg width="28" height="28" viewBox="0 0 28 28"><path d="M19 4.5A10 10 0 1 0 19 23.5 8 8 0 1 1 19 4.5Z" stroke="#c9a84c" stroke-width="1.2" fill="none"/></svg>
      <span style="font-family:'Playfair Display',serif;color:#e8d5a3;font-size:1.1rem;font-weight:600;">RSVP Admin</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div id="user-name" style="color:#c9a84c;font-size:.85rem;opacity:.8;"></div>
      <a href="#" onclick="KJAuth.logout('/admin/login'); return false;" style="display:flex;align-items:center;gap:6px;color:rgba(232,213,163,.5);font-size:.8rem;text-decoration:none;border:1px solid rgba(201,168,76,.2);padding:6px 12px;border-radius:3px;transition:all .2s;" onmouseover="this.style.color='#c9a84c';this.style.borderColor='rgba(201,168,76,.5)'" onmouseout="this.style.color='rgba(232,213,163,.5)';this.style.borderColor='rgba(201,168,76,.2)'">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2H2v10h3M9 4l3 3-3 3M12 7H6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log Keluar
      </a>
    </div>
  </header>

  <!-- Body -->
  <div style="flex:1;padding:32px 24px;max-width:1100px;margin:0 auto;width:100%;">

    <!-- Page title -->
    <div class="fade-in" style="margin-bottom:32px;">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;color:#e8d5a3;margin-bottom:6px;">Senarai Template</h2>
      <p style="color:rgba(232,213,163,.5);font-size:.9rem;">Pilih template untuk diedit atau pratonton.</p>
    </div>

    <!-- Receipt Viewer Modal -->
    <div id="receipt-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:110;align-items:center;justify-content:center;padding:24px;" onclick="closeReceiptModal()">
      <img id="receipt-modal-img" src="" alt="Resit Pembayaran" style="max-width:90vw;max-height:85vh;border-radius:6px;border:1px solid rgba(201,168,76,.4);">
    </div>

    <!-- Sales Stats -->
    <div class="fade-in" style="margin-bottom:36px;">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.3rem;color:#e8d5a3;margin-bottom:14px;">📊 Statistik Jualan</h2>
      <div class="stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
        <div style="background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:20px 24px;">
          <p style="color:rgba(201,168,76,.6);font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;margin-bottom:6px;">Jumlah Hasil</p>
          <p id="stat-revenue" style="font-family:'Playfair Display',serif;font-size:2rem;color:#c9a84c;">—</p>
        </div>
        <div style="background:rgba(76,175,80,.07);border:1px solid rgba(76,175,80,.25);border-radius:6px;padding:20px 24px;">
          <p style="color:rgba(143,217,154,.7);font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;margin-bottom:6px;">Pembelian Aktif</p>
          <p id="stat-active" style="font-family:'Playfair Display',serif;font-size:2rem;color:#8fd99a;">—</p>
        </div>
        <div style="background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:20px 24px;">
          <p style="color:rgba(201,168,76,.6);font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;margin-bottom:6px;">Menunggu Pengesahan</p>
          <p id="stat-pendingcount" style="font-family:'Playfair Display',serif;font-size:2rem;color:#e8d5a3;">—</p>
        </div>
        <div style="background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:20px 24px;">
          <p style="color:rgba(201,168,76,.6);font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;margin-bottom:6px;">Jumlah Pembelian</p>
          <p id="stat-totalpurchases" style="font-family:'Playfair Display',serif;font-size:2rem;color:#c9a84c;">—</p>
        </div>
      </div>
      <div style="background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:20px 24px;">
        <canvas id="package-chart" height="120"></canvas>
      </div>
    </div>

    <!-- Pending Purchases -->
    <div class="fade-in" style="margin-bottom:36px;">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.3rem;color:#e8d5a3;margin-bottom:14px;">⏳ Pembelian Menunggu Pengesahan</h2>
      <div id="pending-list" style="display:grid;gap:12px;">
        <p style="color:rgba(232,213,163,.4);font-size:.85rem;">Memuatkan...</p>
      </div>
    </div>

    <!-- Customers & Purchases -->
    <h2 class="fade-in" style="font-family:'Playfair Display',serif;font-size:1.3rem;color:#e8d5a3;margin-bottom:14px;">👥 Pelanggan &amp; Pembelian</h2>
    <div id="customer-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;">
      <!-- Loading skeleton -->
      <div class="skeleton" style="height:260px;border-radius:6px;"></div>
    </div>

  </div>

  <script>
    if (!KJAuth.getStoredToken()) { location.href = '/admin/login'; }

    // Load user
    KJAuth.authFetch('/api/me').then(r=>r.json()).then(u => {
      document.getElementById('user-name').textContent = 'Selamat datang, ' + u.name;
    });

    // Load sales stats
    const PACKAGE_LABELS = { bronze: '🥉 Bronze', platinum: '🥈 Platinum', gold: '🥇 Gold' };
    let packageChart = null;
    function loadSalesStats() {
      KJAuth.authFetch('/api/admin/sales-stats').then(r => r.json()).then(stats => {
        document.getElementById('stat-revenue').textContent = 'RM' + stats.totalRevenue;
        document.getElementById('stat-active').textContent = stats.totalActive;
        document.getElementById('stat-pendingcount').textContent = stats.totalPending;
        document.getElementById('stat-totalpurchases').textContent = stats.totalPurchases;

        const pkgs = Object.keys(stats.byPackage);
        const ctx = document.getElementById('package-chart').getContext('2d');
        if (packageChart) packageChart.destroy();
        packageChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: pkgs.map(p => PACKAGE_LABELS[p] || p),
            datasets: [
              { label: 'Hasil (RM)', data: pkgs.map(p => stats.byPackage[p].revenue), backgroundColor: 'rgba(201,168,76,.7)' },
              { label: 'Terjual', data: pkgs.map(p => stats.byPackage[p].count), backgroundColor: 'rgba(143,217,154,.7)' },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#e8d5a3' } } },
            scales: {
              x: { ticks: { color: '#e8d5a3' }, grid: { color: 'rgba(201,168,76,.1)' } },
              y: { ticks: { color: '#e8d5a3' }, grid: { color: 'rgba(201,168,76,.1)' }, beginAtZero: true },
            },
          },
        });
      }).catch(() => {});
    }
    loadSalesStats();

    // Load pending purchases
    function loadPendingPurchases() {
      KJAuth.authFetch('/api/admin/pending-purchases').then(r => r.json()).then(list => {
        const el = document.getElementById('pending-list');
        if (!list.length) {
          el.innerHTML = '<p style="color:rgba(232,213,163,.4);font-size:.85rem;">Tiada pembelian menunggu pengesahan.</p>';
          return;
        }
        el.innerHTML = list.map(p => `
          <div style="background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.25);border-radius:6px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:14px;">
              ${p.receiptUrl
                ? `<img src="${p.receiptUrl}" alt="Resit" onclick="openReceiptModal('${p.receiptUrl}')" style="width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid rgba(201,168,76,.4);cursor:pointer;flex-shrink:0;">`
                : `<div style="width:56px;height:56px;border-radius:4px;border:1px dashed rgba(201,168,76,.3);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:rgba(201,168,76,.4);flex-shrink:0;text-align:center;">Tiada Resit</div>`}
              <div>
                <p style="color:#e8d5a3;font-size:.95rem;font-weight:600;">${p.name}${p.groomName ? ' — ' + p.groomName + ' &amp; ' + p.brideName : ''}</p>
                <p style="color:rgba(201,168,76,.6);font-size:.75rem;margin-top:2px;">Pakej: ${p.package.toUpperCase()} · UID: ${p.ownerUid.slice(0,10)}…</p>
              </div>
            </div>
            <div style="display:flex;gap:8px;">
              <button onclick="approvePurchase('${p.id}', this)" style="background:linear-gradient(135deg,#c9a84c,#8b6914);border:none;border-radius:3px;padding:9px 18px;color:#1a3d2b;font-weight:700;font-size:.78rem;cursor:pointer;">✓ Sahkan Bayaran</button>
              <button onclick="rejectPurchase('${p.id}', this)" style="background:transparent;border:1px solid rgba(252,165,165,.5);border-radius:3px;padding:9px 18px;color:#fca5a5;font-weight:700;font-size:.78rem;cursor:pointer;">✕ Batalkan</button>
            </div>
          </div>`).join('');
      }).catch(() => {
        document.getElementById('pending-list').innerHTML = '<p style="color:#fca5a5;font-size:.85rem;">Ralat memuatkan senarai.</p>';
      });
    }
    loadPendingPurchases();

    function openReceiptModal(url) {
      document.getElementById('receipt-modal-img').src = url;
      document.getElementById('receipt-modal').style.display = 'flex';
    }
    function closeReceiptModal() {
      document.getElementById('receipt-modal').style.display = 'none';
    }
    window.openReceiptModal = openReceiptModal;
    window.closeReceiptModal = closeReceiptModal;

    async function approvePurchase(id, btn) {
      btn.disabled = true;
      btn.textContent = 'Mengesahkan...';
      try {
        const res = await KJAuth.authFetch(`/api/template/${id}/approve`, { method: 'POST' });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Ralat');
        loadPendingPurchases();
        loadCustomers();
        loadSalesStats();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = '✓ Sahkan Bayaran';
      }
    }
    window.approvePurchase = approvePurchase;

    async function rejectPurchase(id, btn) {
      if (!confirm('Batalkan pembelian ini? Pelanggan perlu memohon semula jika ingin meneruskan.')) return;
      btn.disabled = true;
      btn.textContent = 'Membatalkan...';
      try {
        const res = await KJAuth.authFetch(`/api/template/${id}/reject`, { method: 'POST' });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Ralat');
        loadPendingPurchases();
        loadCustomers();
        loadSalesStats();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = '✕ Batalkan';
      }
    }
    window.rejectPurchase = rejectPurchase;

    async function removeCustomerPurchase(id, btn) {
      if (!confirm('Buang kad pelanggan ini secara kekal? Tindakan ini tidak boleh dibatalkan.')) return;
      btn.disabled = true;
      btn.textContent = 'Membuang...';
      try {
        const res = await KJAuth.authFetch(`/api/template/${id}/delete`, { method: 'POST' });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Ralat');
        loadCustomers();
        loadSalesStats();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = '🗑 Remove';
      }
    }
    window.removeCustomerPurchase = removeCustomerPurchase;

    // Load customers + their purchases as cards (same visual style as the old "Semua Kad" grid)
    const PACKAGE_COLORS = { bronze: '#a0764a', platinum: '#b9c4cc', gold: '#c9a84c' };
    function loadCustomers() {
      KJAuth.authFetch('/api/admin/customers').then(r => r.json()).then(customers => {
        const el = document.getElementById('customer-list');
        const cards = [];
        customers.forEach(c => {
          c.weddings.forEach(w => {
            cards.push({ customer: c, wedding: w });
          });
        });

        if (!cards.length) {
          el.innerHTML = '<p style="color:rgba(232,213,163,.4);font-size:.85rem;">Tiada pembelian lagi.</p>';
          return;
        }

        el.innerHTML = cards.map(({ customer: c, wedding: w }, i) => {
          const statusLabel = w.purchaseStatus === 'active' ? 'Aktif' : w.purchaseStatus === 'rejected' ? 'Ditolak' : 'Menunggu Pengesahan';
          const statusColor = w.purchaseStatus === 'active' ? '#8fd99a' : w.purchaseStatus === 'rejected' ? '#fca5a5' : '#e8d5a3';
          const pkgColor = PACKAGE_COLORS[w.package] || '#c9a84c';
          const coupleNames = w.groomName || w.brideName ? (w.groomName + ' &amp; ' + w.brideName) : w.name;
          return `
            <div class="card fade-in" style="padding:0;overflow:hidden;animation-delay:${i * 0.05}s;">
              <!-- Thumbnail -->
              <div style="height:140px;background:linear-gradient(160deg,#1a3d2b,#0d2318);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                <div style="position:absolute;inset:0;background:radial-gradient(circle at 60% 40%,rgba(201,168,76,.12),transparent 70%);"></div>
                <div style="text-align:center;position:relative;z-index:1;">
                  <svg width="44" height="44" viewBox="0 0 44 44" style="margin:0 auto 8px;"><path d="M30 7A15.5 15.5 0 1 0 30 37 12.5 12.5 0 1 1 30 7Z" stroke="#c9a84c" stroke-width="1.2" fill="none"/></svg>
                  <p style="font-family:'Playfair Display',serif;color:#c9a84c;font-size:.85rem;">${coupleNames}</p>
                  <span style="display:inline-block;margin-top:6px;font-size:.68rem;font-weight:700;color:${statusColor};background:rgba(0,0,0,.25);padding:2px 10px;border-radius:20px;">${statusLabel}</span>
                </div>
              </div>
              <!-- Info -->
              <div style="padding:20px 22px;">
                <div style="display:flex;align-items:start;justify-content:space-between;margin-bottom:6px;">
                  <div>
                    <h3 style="font-family:'Playfair Display',serif;color:#e8d5a3;font-size:1.05rem;margin-bottom:4px;">${w.designName}${w.designCode ? ` <span style="font-size:.65rem;color:rgba(201,168,76,.55);font-weight:400;">(${w.designCode})</span>` : ''}</h3>
                    <p style="font-size:.72rem;color:rgba(201,168,76,.6);">👤 ${c.name || c.email}</p>
                  </div>
                  <span style="font-size:.68rem;color:${pkgColor};background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:700;">${w.package.toUpperCase()}</span>
                </div>
                ${w.receiptUrl
                  ? `<img src="${w.receiptUrl}" alt="Resit" onclick="openReceiptModal('${w.receiptUrl}')" style="width:42px;height:42px;object-fit:cover;border-radius:4px;border:1px solid rgba(201,168,76,.35);cursor:pointer;margin-bottom:12px;">`
                  : ''}
                <div style="display:flex;gap:10px;margin-top:6px;">
                  <a href="/admin/template/${w.id}/edit" class="btn-edit" style="flex:1;padding:10px;border:none;border-radius:3px;color:#1a3d2b;font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;text-align:center;transition:opacity .2s;">
                    ✏️ Edit
                  </a>
                  ${w.complete ? `
                  <a href="${w.preview}" target="_blank" class="btn-preview" style="flex:1;padding:10px;border-radius:3px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;text-align:center;transition:all .2s;background:transparent;">
                    👁 Pratonton
                  </a>` : ''}
                </div>
                ${w.package !== 'bronze' ? `
                <a href="/admin/template/${w.id}/guests" class="btn-preview" style="display:block;margin-top:10px;padding:10px;border-radius:3px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;text-align:center;transition:all .2s;background:transparent;">
                  👥 Senarai Tetamu
                </a>` : ''}
                <button onclick="removeCustomerPurchase('${w.id}', this)" style="display:block;width:100%;margin-top:10px;padding:10px;border:1px solid rgba(252,165,165,.5);border-radius:3px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:transparent;color:#fca5a5;font-weight:700;">
                  🗑 Remove
                </button>
              </div>
            </div>`;
        }).join('');
      }).catch(() => {
        document.getElementById('customer-list').innerHTML = '<p style="color:#fca5a5;font-size:.85rem;">Ralat memuatkan senarai pelanggan.</p>';
      });
    }
    loadCustomers();

  </script>
</body>
</html>
