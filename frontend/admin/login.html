<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log Masuk — RSVP Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Lato',sans-serif; }
    .gold-border { border-color: #c9a84c; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes ring { 0%{transform:scale(.8);opacity:.5} 100%{transform:scale(1.6);opacity:0} }
    .ring1 { animation: ring 3s ease-out infinite; }
    .ring2 { animation: ring 3s ease-out 1s infinite; }
    input:focus { outline:none; border-color:#c9a84c !important; box-shadow:0 0 0 2px rgba(201,168,76,.2); }
    .btn-login { background:linear-gradient(135deg,#c9a84c,#8b6914); transition:opacity .2s,transform .2s; }
    .btn-login:hover { opacity:.9; transform:scale(1.02); }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  </style>
</head>
<body style="min-height:100vh;background:linear-gradient(160deg,#0d2318 0%,#1a3d2b 50%,#2d5a40 100%);display:flex;align-items:center;justify-content:center;">

  <!-- Background rings -->
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
    <div class="ring1" style="position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(201,168,76,.15);"></div>
    <div class="ring2" style="position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(201,168,76,.1);"></div>
  </div>

  <div style="width:100%;max-width:420px;padding:24px;position:relative;z-index:10;">
    <!-- Logo -->
    <div class="float text-center mb-8">
      <svg width="60" height="60" viewBox="0 0 60 60" class="mx-auto mb-4">
        <path d="M41 9.5A22 22 0 1 0 41 50.5 17.5 17.5 0 1 1 41 9.5Z" stroke="#c9a84c" stroke-width="1.3" fill="none"/>
      </svg>
      <h1 style="font-family:'Playfair Display',serif;color:#e8d5a3;font-size:1.6rem;font-weight:600;">RSVP Admin</h1>
      <p style="color:rgba(232,213,163,.5);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;margin-top:4px;">Sistem Pengurusan Jemputan</p>
    </div>

    <!-- Card -->
    <div style="background:rgba(253,248,240,.05);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:36px 32px;backdrop-filter:blur(10px);">

      <div id="error-box" style="display:none;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.4);border-radius:4px;padding:12px 16px;margin-bottom:20px;">
        <p style="color:#fca5a5;font-size:.85rem;text-align:center;">E-mel atau kata laluan tidak sah. Sila cuba semula.</p>
      </div>

      <form id="loginForm">
        <div style="margin-bottom:20px;">
          <label style="display:block;color:#c9a84c;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;">Alamat E-mel</label>
          <input type="email" id="emailInput" required autocomplete="email"
            style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);border-radius:3px;padding:12px 14px;color:#fdf8f0;font-size:.95rem;transition:border-color .2s;"
            placeholder="email@contoh.com">
        </div>
        <div style="margin-bottom:28px;">
          <label style="display:block;color:#c9a84c;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;">Kata Laluan</label>
          <div style="position:relative;">
            <input type="password" id="pwdInput" required autocomplete="current-password"
              style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);border-radius:3px;padding:12px 44px 12px 14px;color:#fdf8f0;font-size:.95rem;transition:border-color .2s;"
              placeholder="••••••••••">
            <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;">
              <svg id="eye-open" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1 9C1 9 4 3 9 3C14 3 17 9 17 9C17 9 14 15 9 15C4 15 1 9 1 9Z" stroke="#c9a84c" stroke-width="1.3"/><circle cx="9" cy="9" r="2.5" stroke="#c9a84c" stroke-width="1.3"/></svg>
              <svg id="eye-close" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none;"><path d="M1 1L17 17M7.5 4.2C8 4.1 8.5 4 9 4C14 4 17 9 17 9C17 9 16.2 10.5 14.7 12M3.3 6C1.8 7.5 1 9 1 9C1 9 4 15 9 15C10 15 11 14.8 12 14.3" stroke="#c9a84c" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="submitBtn" style="width:100%;padding:13px;border:none;border-radius:3px;color:#1a3d2b;font-family:'Lato',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;">
          Log Masuk
        </button>
      </form>

      <p style="text-align:center;color:rgba(232,213,163,.4);font-size:.75rem;margin-top:20px;">
        Hanya dibenarkan untuk pentadbir yang sah sahaja.
      </p>
    </div>

    <p style="text-align:center;color:rgba(232,213,163,.25);font-size:.7rem;margin-top:24px;letter-spacing:.1em;">
      © 2026 RSVP Wedding System
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCy_P8BG2Ovuni2IzpP-6Y8UWVrgAN0Yok",
      authDomain: "wedd-inv-mangement.firebaseapp.com",
      projectId: "wedd-inv-mangement",
      storageBucket: "wedd-inv-mangement.firebasestorage.app",
      messagingSenderId: "518606939574",
      appId: "1:518606939574:web:7a5b37ad848a31e3384d17",
    };

    const app = initializeApp(firebaseConfig);
    const fbAuth = getAuth(app);

    function showError() {
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('loginForm').classList.add('shake');
      setTimeout(() => document.getElementById('loginForm').classList.remove('shake'), 400);
    }

    function togglePwd() {
      const input = document.getElementById('pwdInput');
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      document.getElementById('eye-open').style.display  = isText ? 'block' : 'none';
      document.getElementById('eye-close').style.display = isText ? 'none'  : 'block';
    }
    window.togglePwd = togglePwd;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('pwdInput').value;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      document.getElementById('error-box').style.display = 'none';

      try {
        const cred = await signInWithEmailAndPassword(fbAuth, email, password);
        const idToken = await cred.user.getIdToken();
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken }),
        });
        if (res.ok) {
          location.href = '/admin/dashboard';
        } else {
          showError();
        }
      } catch (err) {
        showError();
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
