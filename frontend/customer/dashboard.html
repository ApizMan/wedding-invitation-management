<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Saya — KadJemputan</title>
  <script src="/shared-assets/auth-client.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { plum:'#3b1f33','plum-light':'#5c3354','plum-dark':'#241220',rose:'#c98ba0','rose-light':'#f2dde3','rose-gold':'#caa15f',cream:'#fbf7f4' },
      fontFamily: { playfair:['"Playfair Display"','serif'], lato:['Lato','sans-serif'] },
    }}};
  </script>
  <style>
    body { font-family:'Lato',sans-serif; background:#fbf7f4; }
    .card-lift { transition: transform .3s ease, box-shadow .3s ease; }
    .card-lift:hover { transform: translateY(-6px); box-shadow: 0 22px 44px rgba(59,31,51,.18); }
    .status-pending { background: rgba(202,161,95,.15); color: #8a6a2f; }
    .status-active { background: rgba(34,197,94,.12); color: #15803d; }
  </style>
</head>
<body class="text-plum-dark">

<header class="sticky top-0 w-full bg-cream/90 backdrop-blur-md border-b border-rose-light z-40">
  <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
    <a href="/" class="font-playfair font-bold text-lg text-plum">Kad<span class="text-rose-gold">Jemputan</span></a>
    <a href="#" onclick="KJAuth.logout('/profile'); return false;" class="text-xs font-bold px-4 py-2 rounded-full border border-plum/20 hover:bg-plum hover:text-cream transition">Log Keluar</a>
  </div>
</header>

<section class="max-w-5xl mx-auto px-6 py-12">
  <h1 class="font-playfair text-2xl sm:text-3xl font-bold text-plum mb-2">Kad Jemputan Saya</h1>
  <p class="text-plum/50 text-sm mb-10">Urus dan kustomkan kad jemputan yang telah anda tempah.</p>

  <div id="template-list" class="grid sm:grid-cols-2 gap-6">
    <p class="text-plum/40 text-sm">Memuatkan...</p>
  </div>

  <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-rose-light">
    <div class="text-5xl mb-4">💌</div>
    <h2 class="font-playfair text-xl font-bold text-plum mb-2">Anda belum ada kad jemputan</h2>
    <p class="text-plum/50 text-sm mb-6">Pilih reka bentuk kegemaran anda di Katalog untuk mula.</p>
    <a href="/catalog" class="inline-block bg-plum text-cream font-bold px-7 py-3 rounded-full">Lihat Katalog</a>
  </div>
</section>

<script>
  if (!KJAuth.getStoredToken()) { location.href = '/profile'; }

  KJAuth.authFetch('/api/my/templates').then(r => r.json()).then(list => {
    var listEl = document.getElementById('template-list');
    var emptyEl = document.getElementById('empty-state');
    if (!list.length) {
      listEl.classList.add('hidden');
      emptyEl.classList.remove('hidden');
      return;
    }
    listEl.innerHTML = list.map(function (t) {
      var statusLabel = t.purchaseStatus === 'active' ? 'Aktif' : 'Menunggu Pengesahan';
      var statusClass = t.purchaseStatus === 'active' ? 'status-active' : 'status-pending';
      var coupleNames = (t.groomName || t.brideName) ? (t.groomName + ' &amp; ' + t.brideName) : 'Belum diisi';
      var editDisabled = t.purchaseStatus !== 'active';
      return '<div class="card-lift bg-white rounded-2xl border border-rose-light p-7">' +
        '<div class="flex items-center justify-between mb-4">' +
          '<span class="text-xs font-bold uppercase tracking-wide px-3 py-1 rounded-full ' + statusClass + '">' + statusLabel + '</span>' +
          '<span class="text-xs font-bold text-rose-gold uppercase">' + t.package + '</span>' +
        '</div>' +
        '<h3 class="font-playfair font-bold text-lg text-plum mb-1">' + coupleNames + '</h3>' +
        '<p class="text-xs text-plum/40 mb-6">' + t.name + '</p>' +
        (editDisabled
          ? '<button disabled class="block w-full text-center bg-plum/10 text-plum/40 text-sm font-bold py-2.5 rounded-full cursor-not-allowed">Menunggu Pengesahan Admin</button>'
          : '<div class="flex gap-3">' +
              '<a href="/my/template/' + t.id + '/edit" class="flex-1 text-center bg-plum text-cream text-sm font-bold py-2.5 rounded-full">Edit Kad</a>' +
              '<a href="' + t.preview + '" target="_blank" class="flex-1 text-center border-2 border-plum text-plum text-sm font-bold py-2.5 rounded-full">Pratonton</a>' +
            '</div>') +
      '</div>';
    }).join('');
  }).catch(function () {
    document.getElementById('template-list').innerHTML = '<p class="text-red-600 text-sm">Ralat memuatkan senarai kad.</p>';
  });
</script>
</body>
</html>
